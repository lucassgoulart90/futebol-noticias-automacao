name: Verificar Novidades e Enviar Email

on:
  schedule:
    # Executa a cada 30 minutos (o script verifica se está no horário permitido)
    - cron: '*/30 * * * *'
  # Permite execução manual
  workflow_dispatch:

jobs:
  verificar-novidades:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 trafilatura python-dateutil selenium
        pip install python-dotenv
    
    - name: Configurar Chrome usando browser-actions
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        # O Chrome já inclui o driver, não precisa de instalação separada
    
    - name: Configurar variáveis de ambiente
      env:
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
        GREMIO_FIREBASE_KEY: ${{ secrets.GREMIO_FIREBASE_KEY }}
      run: |
        echo "SMTP_SERVER=$SMTP_SERVER" >> .env
        echo "SMTP_PORT=$SMTP_PORT" >> .env
        echo "SMTP_USER=$SMTP_USER" >> .env
        echo "SMTP_PASSWORD=$SMTP_PASSWORD" >> .env
        echo "EMAIL_FROM=$EMAIL_FROM" >> .env
        echo "EMAIL_DESTINATARIOS=$EMAIL_DESTINATARIOS" >> .env
        echo "GREMIO_FIREBASE_KEY=$GREMIO_FIREBASE_KEY" >> .env
    
    - name: Verificar novidades e enviar email
      run: |
        python automacao_novidades.py
